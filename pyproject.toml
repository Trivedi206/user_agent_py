[project]
name = "user-agent-py"
version = "0.1.2"
description = "Parses User-Agent strings to identify browser, OS, engine, and device using only the standard library."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
